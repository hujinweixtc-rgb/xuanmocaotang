const COUNTS = {"文人生活·随笔·美学": 29, "《汽车与修道》系列": 12, "《势》系列": 3, "《心经》详解": 2, "《玄默二十四丹诀》": 4, "《精气神使用说明书》": 9, "《玄默草堂·呼吸之间》": 22, "《玄默草堂饮食全书》": 18, "《打坐说明书》": 7, "《觉·眠——睡觉说明书》": 6, "站桩·太极·武术": 10, "河图洛书·干支·奇门": 17, "古琴·琴学": 119, "书法·篆刻": 16, "《声命传说》·声乐·吟诵": 16, "经典讲记（论语·道德经·庄子·诗经等）": 49, "修炼·丹道·功法（通论）": 51, "《中华百艺》·匠艺·游记": 16, "其他随笔·杂文": 39};
const body = document.getElementById('body');
const toc = document.getElementById('toc');

ORDER.forEach((name, i) => {
  const id = 's' + i;
  const a = document.createElement('a');
  a.href = '#' + id; a.innerHTML = name + '<i>' + COUNTS[name] + '</i>';
  toc.appendChild(a);

  const sec = document.createElement('section');
  sec.id = id;
  sec.innerHTML = '<h2>' + name + '<span>' + COUNTS[name] + ' 篇</span></h2><div class="list"></div>';
  const list = sec.querySelector('.list');
  DATA[name].forEach(([d, t, u]) => {
    const row = document.createElement('div');
    row.className = 'item';
    row.dataset.k = (t + ' ' + d).toLowerCase();
    row.dataset.u = u;

    const hit = document.createElement('div');
    hit.className = 'hit';
    hit.setAttribute('role', 'checkbox');
    hit.setAttribute('tabindex', '0');
    hit.title = '标记已读 / 恢复未读';
    const dot = document.createElement('div'); dot.className = 'dot';
    hit.appendChild(dot);

    const dt = document.createElement('div'); dt.className = 'd'; dt.textContent = d;
    const a2 = document.createElement('a');
    a2.className = 't'; a2.href = u; a2.target = '_blank'; a2.rel = 'noopener'; a2.textContent = t;
    const tip = document.createElement('span'); tip.className = 'tip'; tip.textContent = '恢复未读';

    row.append(hit, dt, a2, tip);
    list.appendChild(row);
  });
  body.appendChild(sec);
});

const KEY = 'xmct.read.v1';
let readSet = new Set();
function loadRead(){
  try { readSet = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch(e) { readSet = new Set(); }
}
function saveRead(){
  try { localStorage.setItem(KEY, JSON.stringify([...readSet])); } catch(e) {}
}
function paint(u){
  document.querySelectorAll('.item').forEach(r => {
    if (r.dataset.u !== u) return;
    const on = readSet.has(u);
    r.classList.toggle('read', on);
    r.querySelector('.hit').setAttribute('aria-checked', on ? 'true' : 'false');
  });
}
function applyAll(){
  document.querySelectorAll('.item').forEach(r => paint(r.dataset.u));
}
function toggleRead(row){
  const u = row.dataset.u;
  const was = readSet.has(u);
  if (was) readSet.delete(u); else readSet.add(u);
  saveRead(); paint(u);
  if (was) toastT('已恢复未读', null);
  else toastT('已标记已读', () => { readSet.delete(u); saveRead(); paint(u); });
}

document.getElementById('body').addEventListener('click', e => {
  const hit = e.target.closest('.hit');
  if (!hit) return;
  e.preventDefault(); e.stopPropagation();
  toggleRead(hit.closest('.item'));
});
document.getElementById('body').addEventListener('keydown', e => {
  const hit = e.target.closest('.hit');
  if (!hit) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleRead(hit.closest('.item')); }
});

let toastTimer = null;
function toastT(msg, undoFn){
  const el = document.getElementById('toast');
  if (undoFn) {
    el.innerHTML = '<span>' + msg + '</span><button type="button">撤销</button>';
    el.querySelector('button').onclick = () => { undoFn(); el.classList.remove('on'); };
  } else {
    el.innerHTML = '<span>' + msg + '</span>';
  }
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), undoFn ? 5000 : 1800);
}

loadRead();
applyAll();

const q = document.getElementById('q');
q.addEventListener('input', () => {
  const k = q.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('section').forEach(sec => {
    let n = 0;
    sec.querySelectorAll('.item').forEach(it => {
      const ok = !k || it.dataset.k.includes(k);
      it.classList.toggle('hide', !ok);
      if (ok) n++;
    });
    sec.classList.toggle('hide', n === 0);
    shown += n;
  });
  document.getElementById('empty').style.display = shown ? 'none' : 'block';
});
q.addEventListener('keydown', e => { if (e.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); } });
</script>
